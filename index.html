<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Happy Nursing Graduation 2027 | Ultra Interactive Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Pacifico&family=Cairo:wght@600;800&display=swap');

    *, *:after, *:before {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111029;
      font-family: 'Montserrat', 'Cairo', sans-serif;
      cursor: pointer;
    }

    #captureArea {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111029;
    }

    #mainCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* شريط الأدوات العلوي */
    .top-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      gap: 10px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Cairo', sans-serif;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    /* خط نبضات القلب ECG */
    .ecg-container {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      height: 60px;
      z-index: 4;
      pointer-events: none;
      opacity: 0.7;
    }
    .ecg-line {
      width: 100%;
      height: 100%;
      stroke: #00ffcc;
      stroke-width: 3;
      fill: none;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawECG 4s linear infinite;
      filter: drop-shadow(0 0 8px #00ffcc);
    }
    @keyframes drawECG {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    /* النص الرئيسي */
    .feliz {
      width: 100%;
      font-size: 55px;
      font-weight: 700;
      color: #f48fb1;
      text-align: center;
      position: absolute;
      top: 42%;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(244, 143, 177, 0.8);
    }

    .feliz.animate {
      animation: vem_feliz 2s ease-in-out 7s forwards;
    }

    .ano_novo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 120px 100px 0px 0px;
      z-index: 5;
      pointer-events: none;
    }

    .ano_novo>span {
      font-size: 165px;
      font-weight: 700;
      color: #7a8fe8;
      text-shadow: 0 0 25px rgba(122, 143, 232, 0.5);
    }

    span.num { margin-right: 50px; }

    span.seis {
      position: absolute;
      top: 50%;
      right: 50%;
      margin-right: -200px;
    }

    span.seis.animate {
      animation: vai_2016 5s ease-in-out 5s forwards;
    }

    span.sete {
      position: absolute;
      right: 0%;
      margin-right: -200px;
    }

    span.sete.animate {
      animation: vem_2017 6s ease-in-out forwards;
    }

    /* قبعة التخرج */
    .cap {
      position: absolute;
      top: -250px;
      left: 50%;
      transform: translateX(-50%) rotate(25deg);
      width: 140px;
      height: 80px;
      opacity: 0;
      z-index: 12;
    }

    .cap.animate {
      animation: drop_cap 2.5s ease-in-out 7.5s forwards;
    }

    .cap-top {
      width: 140px;
      height: 45px;
      background: #2c3e50;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    .cap-base {
      width: 70px;
      height: 35px;
      background: #1a252f;
      border-radius: 0 0 50% 50%;
      position: absolute;
      top: 25px;
      left: 35px;
      z-index: 1;
    }

    .cap-cross {
      width: 16px;
      height: 16px;
      background: #ff4d4d;
      position: absolute;
      top: 32px;
      left: 62px;
      z-index: 4;
      clip-path: polygon(35% 0%, 65% 0%, 65% 35%, 100% 35%, 100% 65%, 65% 65%, 65% 100%, 35% 100%, 35% 65%, 0% 65%, 0% 35%, 35% 35%);
    }

    .cap-tassel {
      width: 4px;
      height: 55px;
      background: #f1c40f;
      position: absolute;
      top: 25px;
      left: 70px;
      z-index: 3;
      transform-origin: top center;
      transform: rotate(15deg);
    }

    .cap-tassel:after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: -4px;
      width: 12px;
      height: 18px;
      background: #f1c40f;
      border-radius: 50%;
    }

    /* كارت التهنئة */
    .card-container {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      text-align: center;
      opacity: 0;
      width: 90%;
      max-width: 600px;
    }

    .card-container.animate {
      animation: fadeInCard 2s ease-in-out 8.5s forwards;
    }

    .name-input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(244, 143, 177, 0.4);
      color: #fff;
      font-size: 22px;
      text-align: center;
      padding: 10px 20px;
      border-radius: 25px;
      outline: none;
      width: 80%;
      font-family: 'Cairo', sans-serif;
      transition: all 0.3s;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }

    .name-input:focus {
      border-color: #00ffcc;
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
      background: rgba(255, 255, 255, 0.15);
    }

    .quote-text {
      margin-top: 12px;
      color: #e0e0e0;
      font-size: 15px;
      font-style: italic;
      line-height: 1.5;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* Keyframes */
    @keyframes vem_2017 {
      0% { right: 0%; }
      66.6666% { right: 50%; margin-right: -300px; }
      90% { right: 50%; margin-right: -300px; }
      100% { right: 50%; }
    }

    @keyframes vai_2016 {
      0% { top: 50%; }
      100% { top: -100%; }
    }

    @keyframes vem_feliz {
      0% { margin-top: 0px; opacity: 0; }
      100% { margin-top: -180px; opacity: 1; }
    }

    @keyframes drop_cap {
      0% { top: -250px; opacity: 0; transform: translateX(-50%) rotate(25deg); }
      40% { opacity: 1; }
      100% { top: -45px; opacity: 1; transform: translateX(-50%) rotate(-12deg); }
    }

    @keyframes fadeInCard {
      0% { opacity: 0; transform: translate(-50%, 20px); }
      100% { opacity: 1; transform: translate(-50%, 0); }
    }


    /* Responsive layout for phones and small tablets */
    html, body, #captureArea {
      min-height: 100%;
      min-height: 100dvh;
    }

    @media (max-width: 600px) {
      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
      }

      #captureArea {
        width: 100%;
        height: 100%;
        height: 100dvh;
      }

      .top-controls {
        top: max(10px, env(safe-area-inset-top));
        left: 10px;
        right: 10px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 7px;
      }

      .ctrl-btn {
        padding: 8px 11px;
        font-size: 12px;
        gap: 5px;
        white-space: nowrap;
      }

      .ano_novo {
        padding: 0;
        align-items: center;
        justify-content: center;
      }

      .ano_novo > span {
        font-size: clamp(58px, 19vw, 105px);
        line-height: 1;
      }

      /* Keep the year itself centered as a complete 2027 on phones. */
      .ano_novo > span.num {
        position: absolute;
        left: 50%;
        right: auto;
        margin: 0;
        transform: translateX(-100%);
        white-space: nowrap;
      }

      span.seis {
        top: 50%;
        right: 50%;
        margin-right: clamp(-82px, -16vw, -55px);
      }

      span.sete {
        right: 50%;
        margin-right: clamp(-82px, -16vw, -55px);
      }

      @keyframes vem_2017 {
        0% { right: 50%; margin-right: -140px; }
        66.6666% { right: 50%; margin-right: -82px; }
        90% { right: 50%; margin-right: -82px; }
        100% { right: 50%; margin-right: -55px; }
      }

      .feliz {
        top: 36%;
        padding: 0 12px;
        font-size: clamp(22px, 7vw, 36px);
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      @keyframes vem_feliz {
        0% { margin-top: 0; opacity: 0; }
        100% { margin-top: -100px; opacity: 1; }
      }

      .cap {
        transform: translateX(-50%) rotate(25deg) scale(.65);
        transform-origin: top center;
      }

      @keyframes drop_cap {
        0% { top: -160px; opacity: 0; transform: translateX(-50%) rotate(25deg) scale(.65); }
        40% { opacity: 1; }
        100% { top: -35px; opacity: 1; transform: translateX(-50%) rotate(-12deg) scale(.65); }
      }

      .card-container {
        bottom: max(52px, calc(env(safe-area-inset-bottom) + 34px));
        width: calc(100% - 28px);
        max-width: 420px;
      }

      .name-input {
        width: 100%;
        max-width: 100%;
        padding: 11px 12px;
        font-size: 16px;
      }

      .quote-text {
        margin-top: 9px;
        font-size: 12px;
        line-height: 1.45;
        padding: 0 4px;
      }

      .ecg-container {
        bottom: max(5px, env(safe-area-inset-bottom));
        height: 32px;
      }

      .ecg-line {
        stroke-width: 4;
      }
    }

    @media (max-width: 360px) {
      .ctrl-btn {
        padding: 7px 9px;
        font-size: 11px;
      }

      .ano_novo > span {
        font-size: 58px;
      }

      .card-container {
        bottom: max(45px, calc(env(safe-area-inset-bottom) + 28px));
      }
    }


    /* Intro screen: nursing graduation identity */
    #introScreen {
      position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      overflow: hidden; color: #fff; text-align: center;
      background: radial-gradient(circle at 50% 38%, rgba(99, 59, 160, .38), transparent 38%),
                  radial-gradient(circle at 15% 85%, rgba(0, 229, 255, .10), transparent 28%), #090817;
      transition: opacity .7s ease, visibility .7s ease;
    }
    #introScreen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-glow { position:absolute; width: min(72vw, 360px); aspect-ratio:1; border-radius:50%;
      background: rgba(204, 61, 255, .14); filter: blur(55px); animation: introPulse 3s ease-in-out infinite alternate; }
    .intro-card { position:relative; width:min(100%, 440px); padding: clamp(26px, 6vw, 42px) 22px 28px;
      border:1px solid rgba(255,255,255,.16); border-radius:30px;
      background:rgba(255,255,255,.055); box-shadow:0 20px 70px rgba(0,0,0,.32), inset 0 1px rgba(255,255,255,.08);
      backdrop-filter:blur(14px); animation: introRise .9s cubic-bezier(.2,.8,.2,1) both; }
    .intro-badge { display:inline-block; padding:9px 17px; border-radius:999px; font:700 13px/1.4 'Cairo',sans-serif;
      background:linear-gradient(110deg,#e84ba9,#8d39d8); box-shadow:0 0 28px rgba(207,65,225,.3); }
    .intro-emblem { width:clamp(110px, 31vw, 150px); height:clamp(110px, 31vw, 150px); margin:22px auto 18px;
      display:grid; place-items:center; position:relative; border-radius:38px;
      background:linear-gradient(145deg,rgba(234,83,197,.22),rgba(91,81,210,.16));
      border:1px solid rgba(255,255,255,.16); box-shadow:0 0 45px rgba(186,71,255,.18); }
    .intro-emblem:before { content:''; position:absolute; inset:10px; border:1px solid rgba(255,255,255,.12); border-radius:30px; }
    .intro-icon { font-size:clamp(58px, 16vw, 82px); filter:drop-shadow(0 0 18px rgba(0,229,255,.32)); animation: introFloat 2.6s ease-in-out infinite; }
    .intro-year { margin:8px 0 0; font:800 clamp(38px, 11vw, 56px)/1.1 'Montserrat','Cairo',sans-serif; letter-spacing:3px;
      background:linear-gradient(90deg,#f3a4ff,#fff,#76eaff); color:transparent; background-clip:text; -webkit-background-clip:text; }
    .intro-title { margin:12px 0 7px; font:800 clamp(19px, 5.3vw, 25px)/1.4 'Cairo',sans-serif; }
    .intro-subtitle { color:#d4cde5; font:500 clamp(13px, 3.7vw, 15px)/1.8 'Cairo',sans-serif; }
    .intro-actions { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:10px; margin-top:23px; }
    .intro-enter, .intro-skip { min-height:46px; border-radius:999px; padding:11px 22px; font:700 14px 'Cairo',sans-serif; cursor:pointer; }
    .intro-enter { color:#fff; border:0; background:linear-gradient(100deg,#e94cab,#a52bce); box-shadow:0 7px 25px rgba(207,55,207,.28); }
    .intro-skip { color:#eee8f6; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.05); }
    .intro-enter:active, .intro-skip:active { transform:scale(.97); }
    .intro-foot { margin-top:17px; color:#a9a0bb; font:400 11px 'Cairo',sans-serif; }
    @keyframes introRise { from { opacity:0; transform:translateY(22px) scale(.97); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes introFloat { 0%,100% { transform:translateY(0) rotate(-3deg); } 50% { transform:translateY(-7px) rotate(3deg); } }
    @keyframes introPulse { from { transform:scale(.88); opacity:.65; } to { transform:scale(1.12); opacity:1; } }
    @media (max-width: 380px) { .intro-card { padding:24px 16px 22px; border-radius:24px; } .intro-emblem { margin:16px auto 12px; } .intro-actions { margin-top:17px; } }
    @media (prefers-reduced-motion: reduce) { .intro-card, .intro-icon, .intro-glow { animation:none; } #introScreen { transition:none; } }

  </style>
</head>

<body>

  <section id="introScreen" aria-label="مقدمة حفل تخرج التمريض">
    <div class="intro-glow" aria-hidden="true"></div>
    <div class="intro-card">
      <div class="intro-badge">✦ لحظة تستحق الاحتفال ✦</div>
      <div class="intro-emblem" aria-hidden="true"><span class="intro-icon">🎓</span></div>
      <div class="intro-year">2027</div>
      <h1 class="intro-title">NURSING GRADUATION</h1>
      <p class="intro-subtitle">سنوات من التعب.. لحظة من الفخر<br>حكاية حلم يستحق أن يُحتفل به 🩺</p>
      <div class="intro-actions">
        <button class="intro-enter" type="button" onclick="enterExperience()">ابدأ الاحتفال ✨</button>
      </div>
      <p class="intro-foot">دفعة التمريض 2027 · بداية حكاية جديدة</p>
    </div>
  </section>

  <div id="captureArea">
    <!-- أدوات التحكم -->
    <div class="top-controls">
      <button class="ctrl-btn" onclick="replayAnimation(event)">
        <span>🔄</span> <span>إعادة التشغيل</span>
      </button>
      <button class="ctrl-btn" id="soundToggle" onclick="toggleSound(event)">
        <span id="soundIcon">🔊</span> <span id="soundText">الصوت مفعل</span>
      </button>
    </div>

    <!-- الكانفاس -->
    <canvas id="mainCanvas"></canvas>

    <!-- ECG -->
    <div class="ecg-container">
      <svg class="ecg-line" viewBox="0 0 1000 100" preserveAspectRatio="none">
        <path d="M0,50 L300,50 L310,20 L320,80 L330,10 L340,90 L350,50 L400,50 L700,50 L710,20 L720,80 L730,10 L740,90 L750,50 L1000,50" />
      </svg>
    </div>

    <div class="feliz animate" id="felizText">NURSING GRADS 🩺</div>

    <div class="ano_novo">
      <span class="num">202</span>
      <span class="seis animate" id="seisNum">6</span>
      <span class="sete animate" id="seteNum">7
        <div class="cap animate" id="capElem">
          <div class="cap-top"></div>
          <div class="cap-base"></div>
          <div class="cap-cross"></div>
          <div class="cap-tassel"></div>
        </div>
      </span>
    </div>

    <div class="card-container animate" id="cardContainer">
      <input type="text" class="name-input" placeholder="اكتب اسم الخريج/ة هنا..." value=" 🩺 ممرضة المستقبل ✨" />
      <p class="quote-text">"To save one life, you're a hero. To save a hundred, you're a nurse." 💖</p>
    </div>
  </div>

  <script>
    // --- Audio Engine ---
    let audioCtx = null;
    let isMuted = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleSound(e) {
      e.stopPropagation();
      isMuted = !isMuted;
      document.getElementById('soundIcon').innerText = isMuted ? '🔇' : '🔊';
      document.getElementById('soundText').innerText = isMuted ? 'الصوت مكتوم' : 'الصوت مفعل';
    }

    function playLaunchSound() {
      if (isMuted || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(750, audioCtx.currentTime + 0.25);

        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } catch (e) {}
    }

    function playExplosionSound() {
      if (isMuted || !audioCtx) return;
      try {
        const bufferSize = audioCtx.sampleRate * 0.4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(700, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

        whiteNoise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        whiteNoise.start();
        whiteNoise.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    // --- Graphics Engine (Fireworks + Confetti + Floating Items) ---
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const colors = ['#f48fb1', '#7a8fe8', '#f5cc06', '#ff4d4d', '#00e676', '#ff9100', '#00e5ff', '#ffffff'];

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 7 + 1.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.gravity = 0.06;
        this.friction = 0.96;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.008;
        this.size = Math.random() * 3 + 1.5;
      }

      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.alpha, 0);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    class Rocket {
      constructor(startX, startY, targetX, targetY, color) {
        this.x = startX;
        this.y = startY;
        this.startX = startX;
        this.startY = startY;
        this.targetX = targetX;
        this.targetY = targetY;
        this.color = color;
        this.speed = 4.5;
        this.angle = Math.atan2(targetY - startY, targetX - startX);
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
        this.distanceTraveled = 0;
        this.exploded = false;

        playLaunchSound();
      }

      update() {
        this.x += this.vx * 2;
        this.y += this.vy * 2;
        this.distanceTraveled = Math.hypot(this.x - this.startX, this.y - this.startY);

        if (this.distanceTraveled >= this.distanceToTarget) {
          this.exploded = true;
          createExplosion(this.targetX, this.targetY, this.color);
        }
      }

      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    class FloatingItem {
      constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * -window.innerHeight;
        this.type = Math.random() < 0.3 ? 'cap' : (Math.random() < 0.5 ? 'steth' : 'confetti');
        this.size = Math.random() * 12 + 10;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.vy = Math.random() * 2 + 1.2;
        this.vx = Math.random() * 2 - 1;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = Math.random() * 6 - 3;
      }

      update() {
        this.y += this.vy;
        this.x += this.vx;
        this.rotation += this.rotationSpeed;
        if (this.y > window.innerHeight) {
          this.y = -30;
          this.x = Math.random() * window.innerWidth;
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);

        if (this.type === 'cap') {
          ctx.font = `${this.size + 6}px sans-serif`;
          ctx.fillText('🎓', -this.size / 2, this.size / 2);
        } else if (this.type === 'steth') {
          ctx.font = `${this.size + 6}px sans-serif`;
          ctx.fillText('🩺', -this.size / 2, this.size / 2);
        } else {
          ctx.fillStyle = this.color;
          ctx.fillRect(-this.size / 4, -this.size / 4, this.size / 2, this.size / 2);
        }

        ctx.restore();
      }
    }

    let rockets = [];
    let particles = [];
    let floatingItems = [];
    let autoLaunchTimer = null;
    let isFireworksActive = false;

    function createExplosion(x, y, color) {
      playExplosionSound();
      for (let i = 0; i < 80; i++) {
        particles.push(new Particle(x, y, color || colors[Math.floor(Math.random() * colors.length)]));
      }
    }

    function launchRandomRocket(targetX, targetY) {
      initAudio();
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;
      const startX = Math.random() * logicalWidth;
      const startY = logicalHeight;
      const tX = targetX || Math.random() * (logicalWidth * 0.8) + logicalWidth * 0.1;
      const tY = targetY || Math.random() * (logicalHeight * 0.5) + 50;
      const color = colors[Math.floor(Math.random() * colors.length)];
      rockets.push(new Rocket(startX, startY, tX, tY, color));
    }

    window.addEventListener('pointerdown', (e) => {
      if (!document.getElementById('introScreen').classList.contains('is-hidden')) return;
      if (!e.target.closest('.top-controls') && e.target.tagName !== 'INPUT') {
        initAudio();
        launchRandomRocket(e.clientX, e.clientY);
      }
    });

    function startCelebration() {
      setTimeout(() => {
        isFireworksActive = true;
        initAudio();

        floatingItems = [];
        for (let i = 0; i < 60; i++) {
          floatingItems.push(new FloatingItem());
        }

        for (let i = 0; i < 4; i++) {
          setTimeout(() => launchRandomRocket(), i * 250);
        }

        if (autoLaunchTimer) clearInterval(autoLaunchTimer);
        autoLaunchTimer = setInterval(() => {
          if (isFireworksActive) {
            launchRandomRocket();
            if (Math.random() < 0.4) {
              setTimeout(() => launchRandomRocket(), 200);
            }
          }
        }, 650);
      }, 7500);
    }

    // زر إعادة التشغيل
    function replayAnimation(e) {
      e.stopPropagation();
      isFireworksActive = false;
      if (autoLaunchTimer) clearInterval(autoLaunchTimer);
      rockets = [];
      particles = [];
      floatingItems = [];

      const elems = ['felizText', 'seisNum', 'seteNum', 'capElem', 'cardContainer'];
      elems.forEach(id => {
        const el = document.getElementById(id);
        el.classList.remove('animate');
        void el.offsetWidth; // Force Reflow
        el.classList.add('animate');
      });

      startCelebration();
    }

    let experienceStarted = false;
    function enterExperience() {
      if (experienceStarted) return;
      experienceStarted = true;
      document.getElementById('introScreen').classList.add('is-hidden');
      const elems = ['felizText', 'seisNum', 'seteNum', 'capElem', 'cardContainer'];
      elems.forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('animate');
        void el.offsetWidth;
        el.classList.add('animate');
      });
      startCelebration();
    }

    function loop() {
      requestAnimationFrame(loop);

      ctx.fillStyle = 'rgba(17, 16, 41, 0.25)';
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

      for (let i = rockets.length - 1; i >= 0; i--) {
        rockets[i].update();
        rockets[i].draw();
        if (rockets[i].exploded) rockets.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) particles.splice(i, 1);
      }

      for (let i = 0; i < floatingItems.length; i++) {
        floatingItems[i].update();
        floatingItems[i].draw();
      }
    }

    loop();
  </script>
</body>
